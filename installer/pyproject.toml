[project]
name = "KonomiTV-Installer"
version = "0.14.1"
description = "KonomiTV Installer"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiofiles>=24.1.0,<25",
    "distro>=1.8.0,<2",
    "elevate>=0.1.3,<1.0.0",
    "emoji>=2.14.0,<3",
    "ifaddr<=0.2.0,<1.0.0",
    "psutil>=6.0.0,<7",
    "py7zr>=1.1.3,<2",
    # For the Windows version only, to prevent virus detection, when the installer is built by CI,
    # it is forced to replace the PyInstaller with the build whose bootloader is rebuilt with MinGW by yt-dlp.
    # PyInstaller 6.22.1 and 6.22.2 have regressions, so pin to 6.22.0 in the same way as yt-dlp.
    # On other platforms, PyInstaller is installed from PyPI as usual.
    # ref: https://github.com/yt-dlp/Pyinstaller-Builds
    "pyinstaller @ https://github.com/yt-dlp/Pyinstaller-Builds/releases/download/2026.08.19.215425/pyinstaller-6.22.0-py3-none-win_amd64.whl ; sys_platform == 'win32'",
    "pyinstaller==6.22.0 ; sys_platform != 'win32'",
    "pyright>=1.1.403,<2",
    "requests>=2.32.4,<3",
    "rich>=13.9.3,<14",
    "ruamel.yaml==0.18.12",
    "ruff>=0.9.1,<1.0.0",
    "taskipy>=1.14.0,<2",
    "tzdata>=2024.2,<2025",
    "watchdog>=5.0.3,<6",
]

[tool.taskipy.tasks]
dev = "python KonomiTV-Installer.py"
lint = "ruff check --fix . ; pyright"
typecheck = "pyright"
# KonomiTV-Installer.spec は PyInstaller によって自動生成された .spec をベースにカスタマイズしている
build = "pyinstaller --clean KonomiTV-Installer.spec"

[tool.uv]
package = false

[tool.ruff]
# インデントの幅を4スペースに設定
indent-width = 4
# Python 3.13 を利用する
target-version = "py313"
# build/, dist/ ディレクトリは対象から除外する
extend-exclude = ["build/", "dist/"]

[tool.ruff.lint]
# flake8, pycodestyle, pyupgrade, isort, Ruff 固有のルールを使う
select = ["F", "E", "W", "UP", "I", "RUF", "TID251"]
ignore = [
    "E501",    # 1行の長さを超えている場合の警告を抑制
    "E731",    # Do not assign a `lambda` expression, use a `def` を抑制
    "RUF001",  # 全角記号など `ambiguous unicode character` も使いたいため
    "RUF002",  # 全角記号など `ambiguous unicode character` も使いたいため
    "RUF003",  # 全角記号など `ambiguous unicode character` も使いたいため
    "RUF012",
    "UP018",   # 複数行のメッセージを Padding(str(...)) で囲む書き方を f-string の有無に関わらず統一するため
]

[tool.ruff.lint.isort]
# インポートブロックの後に2行空ける
lines-after-imports = 2

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# server/ と同じく、typing_extensions.TypedDict ではなく標準の typing.TypedDict に統一する
"typing_extensions.TypedDict".msg = "Use typing.TypedDict instead."

[tool.pyright]
# Python バージョンを指定
pythonVersion = "3.13"
# TypeCheckingMode を strict に設定（VSCode の設定と同等）
typeCheckingMode = "strict"
# プロジェクトルートを指定
pythonPlatform = "All"
# 除外するパス
exclude = [
    "**/__pycache__",
    "**/.venv",
    "build/",
    "dist/",
    "*.spec",
]
# VSCode の settings.json の diagnosticSeverityOverrides に対応する設定
reportConstantRedefinition = "none"
reportDeprecated = "warning"
reportMissingTypeStubs = "none"
reportPrivateImportUsage = "none"
reportUnnecessaryComparison = "none"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnusedFunction = "none"
