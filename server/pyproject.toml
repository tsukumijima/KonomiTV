[project]
name = "KonomiTV"
version = "0.15.0-dev"
description = "KonomiTV: Kept Organized, Notably Optimized, Modern Interface TV media server"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aerich==0.10.1",
    "aiofiles>=24.1.0",
    "aiohttp>=3.12.14",
    "ariblib @ https://github.com/tsukumijima/ariblib/releases/download/v0.1.4/ariblib-0.1.4-py3-none-any.whl",
    "atproto==0.0.68",
    "av>=19.0.0,<20.0.0",
    "beautifulsoup4>=4.12.3",
    "biim @ https://github.com/tsukumijima/biim/releases/download/v1.11.0-post1/biim-1.11.0.post1-py3-none-any.whl",
    "colorama>=0.4.6,<1.0.0",
    "elevate>=0.1.3,<1.0.0",
    "fastapi>=0.162.0,<1.0.0",
    "hashids>=1.3.1",
    "httpx2[http2]>=2.13.1,<3.0.0",
    "opencv-contrib-python-headless>=5.0.0.93,<6.0.0",
    "pillow>=11.3.0",
    "ping3>=4.0.8",
    "psutil>=6.0.0",
    "puremagic>=1.28",
    "pwdlib[bcrypt]>=0.3.1",
    "py7zr>=1.1.3",
    "pydantic>=2.10.3",
    "python-jose[cryptography]>=3.4.0",
    "python-multipart>=0.0.20,<1.0.0",
    "pywin32>=311 ; sys_platform == 'win32'",
    "requests>=2.32.4",
    "rich>=13.9.4",
    "ruamel.yaml==0.18.12",
    "sse-starlette>=2.1.3",
    "taskipy>=1.14.1",
    "tortoise-orm>=1.1.9",
    "typer>=0.21.0,<1.0.0",
    "typing-extensions>=4.12.2",
    "typing-inspect>=0.9.0,<1.0.0",
    "tzdata>=2024.2",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "uvloop>=0.21.0,<1.0.0 ; sys_platform == 'linux'",
    "watchfiles>=1.0.4",
    "winloop>=0.1.8,<1.0.0 ; sys_platform == 'win32'",
    "zendriver>=0.15.3,<1.0.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "pyright>=1.1.403,<2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-env>=1.8.1",
    "ruff>=0.9.1,<1.0.0",
    "syrupy>=6.1.1",
]

[tool.taskipy.tasks]
serve = "python KonomiTV.py"
dev = "python KonomiTV.py --reload"
lint = "ruff check --fix . ; pyright"
typecheck = "pyright"
test = "pytest"
update-snapshots = "pytest --snapshot-update"
update-thirdparty = "python -m misc.UpdateThirdparty latest"

[tool.uv]
package = false
# 開発時は uv sync / uv run で dev グループ (Ruff・Pyright) も自動的にインストールする
## uv の既定値と同じだが、インストーラーなどで --no-dev を指定している理由が読み取れるよう明示している
default-groups = ["dev"]

[tool.aerich]
tortoise_orm = "app.constants.DATABASE_CONFIG"
location = "./app/migrations/"
src_folder = "./"

[tool.pytest.ini_options]
# テストを実行するディレクトリを指定
testpaths = ["tests"]
# async def で定義されたテストを自動的にイベントループで実行する
asyncio_mode = "auto"
# テスト全体で1つのイベントループを共有し、Tortoise ORM の接続とイベントループを一致させる
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# テスト完了後に一時ディレクトリを即座に削除する
tmp_path_retention_policy = "none"
# FastAPI の on_event() は非推奨だが、lifespan への移行は起動・終了処理の書き方が大きく変わるため当面そのまま使う
## 互換性のために残されている API なので、テストの実行結果には警告を表示しない (Pyright では引き続き警告される)
## 警告のメッセージは改行と空白から始まるため、先頭の空白を \s* で読み飛ばして照合する
filterwarnings = [
    "ignore:\\s*on_event is deprecated:DeprecationWarning",
]

# テストの実行時に設定する環境変数
## KONOMITV_TEST が 1 のとき、書き込みが発生するファイルとフォルダの名前に .test が付き、実際に使っている DB・設定・サムネイル・ログと分かれる
[tool.pytest_env]
KONOMITV_TEST = "1"

[tool.ruff]
# インデントの幅を4スペースに設定
indent-width = 4
# Python 3.13 を利用する
target-version = "py313"
# data/, thirdparty/ ディレクトリは対象から除外する
extend-exclude = ["data/", "thirdparty/"]

[tool.ruff.lint]
# flake8, pycodestyle, pyupgrade, isort, Ruff 固有のルールを使う
select = ["F", "E", "W", "UP", "I", "RUF", "TID251"]
ignore = [
    "E501",    # 1行の長さを超えている場合の警告を抑制
    "E731",    # Do not assign a `lambda` expression, use a `def` を抑制
    "RUF001",  # 全角記号など `ambiguous unicode character` も使いたいため
    "RUF002",  # 全角記号など `ambiguous unicode character` も使いたいため
    "RUF003",  # 全角記号など `ambiguous unicode character` も使いたいため
    "RUF012",
]

[tool.ruff.lint.isort]
# インポートブロックの後に2行空ける
lines-after-imports = 2

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Python 3.12 以降は Pydantic が標準の typing.TypedDict を扱えるため、typing_extensions.TypedDict ではなく typing.TypedDict に統一する
"typing_extensions.TypedDict".msg = "Use typing.TypedDict instead."
# tortoise.timezone は Tortoise ORM の初期化状態とバージョンによって返すタイムゾーンが変わる (初期化前は UTC) ため、JST を明示した datetime.now(JST) に統一する
"tortoise.timezone".msg = "Use datetime.now(JST) instead."

[tool.pyright]
# Python バージョンを指定
pythonVersion = "3.13"
# Pyright 実行時に server/.venv/ を確実に参照させる
# この設定により Codex サンドボックス上から Pyright を実行すると依存関係を解決できない問題を回避できる
venvPath = "."
venv = ".venv"
# TypeCheckingMode を strict に設定（VSCode の設定と同等）
typeCheckingMode = "strict"
# プロジェクトルートを指定
pythonPlatform = "All"
# インクルードするパッケージパス
include = ["app/", "tests/"]
# 除外するパス
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/node_modules",
    "data/",
    "logs/",
]
# VSCode の settings.json の diagnosticSeverityOverrides に対応する設定
reportConstantRedefinition = "none"
reportDeprecated = "warning"
reportMissingTypeStubs = "none"
reportPrivateImportUsage = "none"
reportUnnecessaryComparison = "none"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnusedFunction = "none"
